---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
  labels:
    type: local
    app: mysql
    tier: database
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  # Retain : supprimer le PVC n'efface pas les données
  persistentVolumeReclaimPolicy: Retain
  # manual : empêche la StorageClass par défaut de Minikube de créer un autre volume
  storageClassName: manual
  hostPath:
    path: /data/mysql
